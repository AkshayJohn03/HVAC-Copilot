[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hvac-copilot"
version = "0.1.0"
description = "Multimodal document processor + grounded RAG assistant for HVAC field technicians (fault codes, wiring, maintenance, safety-critical refrigerant work)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshay John Xavier", email = "akshay3rishi@gmail.com" }]
keywords = ["rag", "multimodal", "hvac", "retrieval", "bm25", "fastapi", "grounding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ruff>=0.4",
]

[project.optional-dependencies]
# All optional extras are lazily imported at runtime with graceful fallbacks.
pdf = ["pymupdf>=1.24"]                    # real PDF page parsing + page images
rerank = ["sentence-transformers>=2.7"]    # cross-encoder reranking
ocr = ["pytesseract>=0.3.10"]              # OCR fallback for scanned pages
qdrant = ["qdrant-client>=1.9"]            # vector store backend

[project.scripts]
hvac-copilot-eval = "hvac_copilot.eval.__main__:main"
hvac-build-corpus = "hvac_copilot.scripts.build_corpus:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hvac_copilot"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "corpus", "data", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
